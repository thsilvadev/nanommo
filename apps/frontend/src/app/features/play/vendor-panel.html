<section class="vendor-panel" aria-label="Town Vendor">
  <div class="npc-select"><label for="town-npc-select">Choose NPC</label><select id="town-npc-select" aria-label="Choose NPC" [value]="vendor.selectedNpcId()" (change)="vendor.selectNpc($any($event.target).value)"><option *ngFor="let npc of vendor.npcs()" [value]="npc.id">{{npc.name}}</option></select></div>
  <ng-container *ngIf="vendor.selectedNpc() as npc">
    <div class="vendor-title"><strong>{{npc.name}}</strong><span>{{npc.types.join(' / ') | uppercase}}</span></div>

    <ng-container *ngIf="npc.types.includes('vendor')">
      <p class="vendor-greeting">{{npc.greeting || 'Hello, adventurer!'}}</p>
      <div id="vendor-drop-list" cdkDropList [cdkDropListConnectedTo]="['inventory-drop-list']" cdkDropListSortingDisabled (cdkDropListDropped)="drop($event)" class="vendor-grid">
        <div *ngFor="let slot of slots" class="vendor-slot" [class.filled]="stockAt(slot)">
          <div *ngIf="stockAt(slot) as item" cdkDrag [cdkDragData]="dragData(item)" class="vendor-item">
            <img [src]="vendor.catalog.itemIcon(item.itemId)" [alt]="vendor.itemName(item.itemId)" class="vendor-icon">
            <b>∞</b><small>{{item.buyPrice}} G</small>
            <ng-template cdkDragPreview><img class="vendor-drag-preview" [src]="vendor.catalog.itemIcon(item.itemId)" [alt]="vendor.itemName(item.itemId)"></ng-template>
            <ng-template cdkDragPlaceholder><span class="vendor-placeholder"></span></ng-template>
          </div>
        </div>
      </div>
    </ng-container>

    <div class="quest-dialogue" *ngIf="npc.types.includes('quest') && vendor.dialogue() as dialogue">
      <p class="quest-text">{{dialogue.npcText}}</p>
      <div class="quest-choices">
        <button *ngFor="let choice of dialogue.choices" type="button" [disabled]="vendor.busy()" (click)="vendor.chooseDialogue(choice.id)">{{choice.text}}</button>
      </div>
    </div>

    <div class="vendor-error" *ngIf="vendor.error()">{{vendor.error()}}</div>
  </ng-container>
</section>
