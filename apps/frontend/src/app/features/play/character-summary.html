<section class="panel summary"><div class="panel-title"><span>CHARACTER</span><button (click)="go('/play/character')">OPEN</button></div><div class="portrait">{{initial()}}</div><h2>{{character.character()?.name||'Loading...'}}</h2><div class="level">LEVEL {{character.character()?.level||'—'}}</div><div class="bar-row"><span>HP</span><div class="bar hp"><i [style.width.%]="hpPct()"></i></div><b>{{character.character()?.hpCurrent??'—'}}</b></div><div class="bar-row"><span>SP</span><div class="bar sp"><i [style.width.%]="spPct()"></i></div><b>{{character.character()?.spCurrent??'—'}}</b></div><div class="equip-quick"><div *ngFor="let slot of slots" [class.focused]="isSlotFocused(slot.key)" class="equip-slot" [title]="slot.label" cdkDropList [id]="slotDropId(slot.key)" [cdkDropListConnectedTo]="['inventory-drop-list']" (cdkDropListDropped)="dropEquipment(slot.key,$event)"><ng-container *ngIf="equipped(slot.key) as eq"><div cdkDrag [cdkDragData]="equipDragData(slot.key,eq)" (cdkDragStarted)="onEquipmentDragStart(eq.itemId)" (cdkDragEnded)="onEquipmentDragEnd()" (dblclick)="unequip(slot.key)" class="equip-drag"><img [src]="catalog.itemIcon(eq.itemId)" [alt]="catalog.item(eq.itemId)?.name||eq.itemId"><span>{{itemName(slot.key)}}</span></div></ng-container><ng-container *ngIf="!equipped(slot.key)"><img [src]="slot.icon" [alt]="slot.label"><small>{{slot.label}}</small></ng-container></div></div><div class="status-line"><span class="status-dot"></span>{{statusLabel()}}</div></section>
