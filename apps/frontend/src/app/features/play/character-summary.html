<section class="panel summary"><div class="panel-title"><span>CHARACTER</span><button (click)="go('/play/character')">OPEN</button></div><div class="portrait">{{initial()}}</div><h2>{{character.character()?.name||'Loading...'}}</h2><div class="level">LEVEL {{character.character()?.level||'—'}}</div><div class="bar-row"><span>HP</span><div class="bar hp"><i [style.width.%]="hpPct()"></i></div><b>{{character.character()?.hpCurrent??'—'}}</b></div><div class="bar-row"><span>SP</span><div class="bar sp"><i [style.width.%]="spPct()"></i></div><b>{{character.character()?.spCurrent??'—'}}</b></div><div class="equip-quick"><div *ngFor="let slot of slots" class="equip-slot" [title]="slot.label"><img [src]="slot.icon" alt=""><span>{{itemName(slot.key)}}</span></div></div><div class="status-line"><span class="status-dot"></span>{{statusLabel()}}</div></section>
