<section class="panel map-panel">
  <div #viewport class="viewport" role="application" aria-label="World map. Drag to explore and select a revealed location." (pointerdown)="onPointerDown($event)" (pointermove)="onPointerMove($event)" (pointerup)="onPointerUp($event)" (pointercancel)="onPointerCancel($event)" (lostpointercapture)="onPointerCancel($event)" (wheel)="onWheel($event)" (click)="onViewportClick($event)">
    <div class="map-head">
      <h1>Currently in: {{mapName()}}</h1>
      <div class="map-meta">
        <div *ngIf="activityGaugeVisible()" class="activity-gauge" [class.traveling]="activityKind()==='traveling'" [class.gathering]="activityKind()==='gathering'" role="progressbar" [attr.aria-label]="activityLabel()" [attr.aria-valuenow]="activityProgress()" aria-valuemin="0" aria-valuemax="100">
          <div class="activity-gauge-fill" [style.width.%]="activityProgress()"></div>
          <strong>{{activityLabel()}}</strong>
        </div>
        <span *ngIf="character.character()?.currentMapId">Players in map: {{playersInMap()}}</span>
      </div>
    </div>
    <div class="world" [style.transform]="'translate3d('+(-cameraX()*zoom())+'px,'+(-cameraY()*zoom())+'px,0) scale('+zoom()+')'">
      <img class="world-art" src="/assets/maps/map-background.png" alt="" draggable="false">
      <ng-container *ngFor="let cell of cells; trackBy: trackCell">
        <div class="fog-cell" *ngIf="!isRevealed(cell.x,cell.y)" [style.left.px]="cell.col*153" [style.top.px]="cell.row*153" aria-hidden="true"></div>
      </ng-container>
      <svg *ngIf="destinationRoute().length>1" class="destination-route" viewBox="0 0 2295 1989" preserveAspectRatio="none" aria-hidden="true">
        <polyline [attr.points]="destinationRoutePoints()" />
      </svg>
      <button *ngFor="let tile of maps; trackBy: trackMap" type="button" class="map-tile" [style.left.px]="gridColumn(tile)*153" [style.top.px]="gridRow(tile)*153" [class.current]="tile.id===character.character()?.currentMapId" [class.destination]="tile.id===displayDestinationMapId()" [attr.aria-label]="tile.name" [attr.data-map-id]="tile.id" [disabled]="!isRevealed(tile.coordinates.x,tile.coordinates.y) || tile.isClickable===false" (pointerenter)="showTileTooltip(tile,$event)" (pointermove)="moveTileTooltip($event)" (pointerleave)="hideTileTooltip()" (focus)="showTileTooltip(tile,$event)" (blur)="hideTileTooltip()">
        <img *ngIf="tile.id===displayDestinationMapId()" class="destination-pinpoint" src="/project/destination_pinpoint.png" alt="Destination">
        <img *ngIf="mapHasNpcNotification(tile)" class="map-notification-dot" src="/assets/ui/notification_dot.png" alt="New NPC available"><img *ngIf="tile.type==='town' && tile.id===character.character()?.savedTownMapId" class="town-waypoint" src="/project/T_waypoint.png" alt="Saved Town waypoint">
        <span class="map-tooltip-content"><strong>{{tile.name}}</strong><small *ngIf="tile.type==='grind'">Recommended level: {{tile.recommendedLevel ?? 1}}</small><small *ngIf="tile.type==='town'">Town</small><small *ngIf="tile.type!=='town' && tile.type!=='grind'">{{tile.type | titlecase}}</small></span>
      </button>
      <img *ngIf="currentMap()" class="location-pin" src="/assets/maps/pinpoint.svg" alt="Current location" [style.animation]="character.character()?.travelIntent ? 'none' : null" [style.left.px]="locationPinPosition().x" [style.top.px]="locationPinRenderY()">
    </div>
  </div>
  <p *ngIf="fleeNotice()" class="map-error flee-success">{{fleeNotice()}}</p>
  <p *ngIf="mapTransitionPending()" class="map-feedback">waiting for battle to end to move...</p>
  <p *ngIf="error()" class="map-error">{{error()}}</p>
</section>
