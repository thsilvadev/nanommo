<section class="panel map-panel">
    <div class="map-head">
        <div>
            <h1>Currently in: {{mapName()}}</h1>
        </div>
        <div class="map-meta"><span *ngIf="character.character()?.currentMapId">Players in map:
                {{playersInMap()}}</span><span class="map-state">{{character.character()?.status}}</span></div>
    </div>
    <div class="map-art">
        <div class="grid-overlay"></div>
        <div class="town-center" role="button" tabindex="0" aria-label="Return to Town" (click)="enterTown()"
            (keydown.enter)="enterTown()" (keydown.space)="enterTown()"><img src="/assets/ui/map.svg" alt=""><b>Town</b>
        </div><button type="button" *ngFor="let tile of maps" class="map-tile"
            [class.selected]="tile.id===selected() || tile.id===character.character()?.currentMapId"
            [class.locked]="tile.unlockLevel>level()" (click)="select(tile); enter(tile.id)"
            [attr.aria-disabled]="tile.unlockLevel>level()" [disabled]="tile.unlockLevel>level()"
            (keydown.enter)="enter(tile.id)" (keydown.space)="enter(tile.id)"><img src="/assets/ui/map.svg"
                alt=""><b>{{tile.name}}</b><small>Lv {{tile.unlockLevel}}</small></button>
    </div>
    <p *ngIf="townReturnPending()" class="map-feedback">Waiting for battle to end to return to Town...</p>
    <p *ngIf="error()" class="map-error">{{error()}}</p>
</section>
