<section class="panel map-panel"><div class="map-head"><div><small>LOCATION</small><h1>Currently in: {{mapName()}}</h1></div><div class="map-state">{{character.character()?.status}}</div></div><div class="map-art"><div class="grid-overlay"></div><div class="town-center" aria-label="Town"><img src="/assets/ui/map.svg" alt=""><b>Town</b></div><button type="button" *ngFor="let tile of maps" class="map-tile" [class.selected]="tile.id===selected() || tile.id===character.character()?.currentMapId" [class.locked]="tile.unlockLevel>level()" (click)="select(tile); enter(tile.id)" [attr.aria-disabled]="tile.unlockLevel>level()" [disabled]="tile.unlockLevel>level()" (keydown.enter)="enter(tile.id)" (keydown.space)="enter(tile.id)"><img src="/assets/ui/map.svg" alt=""><b>{{tile.name}}</b><small>Lv {{tile.unlockLevel}}</small></button></div><p *ngIf="error()" class="map-error">{{error()}}</p></section>
