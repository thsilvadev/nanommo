<section class="panel map-panel">
    <div class="map-art">
        <div class="grid-overlay"></div>
        <div class="map-head">
            <h1>Currently in: {{mapName()}}</h1>
            <div class="map-meta"><span *ngIf="character.character()?.currentMapId">Players in map: {{playersInMap()}}</span></div>
        </div>
        <div class="town-center" role="button" tabindex="0" [style.gridColumn]="(townMap?.coordinates?.x ?? 0) + 1" [style.gridRow]="(townMap?.coordinates?.y ?? 0) + 2" [attr.aria-label]="'Return to '+(townMap?.name || 'Town')" (click)="enterTown()"
            (keydown.enter)="enterTown()" (keydown.space)="enterTown()"><img src="/assets/ui/map.svg" alt=""><b>{{townMap?.name || 'Town'}}</b>
        </div><button type="button" *ngFor="let tile of grindMaps" class="map-tile" [style.gridColumn]="(tile.coordinates?.x ?? 0) + 1" [style.gridRow]="(tile.coordinates?.y ?? 0) + 2"
            [class.selected]="tile.id===selected() || tile.id===character.character()?.currentMapId"
            [class.locked]="tile.isClickable === false || tile.unlockLevel>level()" (click)="select(tile); enter(tile.id)"
            [attr.aria-disabled]="tile.isClickable === false || tile.unlockLevel>level()" [disabled]="tile.isClickable === false || tile.unlockLevel>level()"
            (keydown.enter)="enter(tile.id)" (keydown.space)="enter(tile.id)"><img src="/assets/ui/map.svg"
                alt=""><b>{{tile.name}}</b><small>Lv {{tile.unlockLevel}}</small></button>
    </div>
    <p *ngIf="townReturnPending()" class="map-feedback">Waiting for battle to end to move...</p>
    <p *ngIf="error()" class="map-error">{{error()}}</p>
</section>
