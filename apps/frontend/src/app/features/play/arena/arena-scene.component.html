<div class="arena-scene">
  <div #stage class="arena-stage"></div>
  @if (failed()) {
    <p class="arena-failed">{{ locale.t('The arena needs WebGL, which this browser cannot provide.') }}</p>
  }
  <!-- Names, bars and floating numbers: written by refreshHud() straight to the DOM. -->
  <div #hudLayer class="arena-hud-layer" aria-hidden="true"></div>
  <div #wipe class="arena-wipe" style="opacity:0"></div>
</div>
