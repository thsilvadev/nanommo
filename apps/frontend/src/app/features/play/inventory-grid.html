<section class="panel inventory"><div class="panel-title"><span>Inventory</span></div><div id="inventory-drop-list" cdkDropList cdkDropListSortingDisabled [cdkDropListConnectedTo]="characterSlotIds.concat(vendorDropListIds)" (cdkDropListDropped)="dropInventory($event)" class="inv-grid"><div *ngFor="let i of slots" class="inv-slot"><div *ngIf="item(i) as it" cdkDrag [cdkDragData]="dragData(it)" (cdkDragStarted)="onDragStart($event)" (cdkDragEnded)="onDragEnd()" class="item" [ngClass]="itemTierClass(it)" (dblclick)="doubleClick(it)"><img class="item-icon" [src]="glyph(it)" [alt]="itemTitle(it)"><b *ngIf="displayQuantity(it)>1">{{displayQuantity(it)}}</b><div class="item-tooltip"><strong>{{itemTitle(it)}}</strong><span *ngFor="let line of itemTooltipLines(it)">{{line.label}}: {{line.value}}</span></div><ng-template cdkDragPreview><img class="drag-preview-icon" [src]="glyph(it)" [alt]="itemTitle(it)"></ng-template><ng-template cdkDragPlaceholder><span class="item-drag-placeholder"></span></ng-template></div></div></div></section>
