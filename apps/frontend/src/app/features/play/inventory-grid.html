<section class="panel inventory"><div class="panel-title"><span>Equipment & Inventory</span></div><div cdkDropListGroup class="equipment-grid"><div *ngFor="let pair of equipmentSlots" class="equip-drop" cdkDropList [cdkDropListData]="pair[0]" [class.focused]="activeSlot()===pair[0]" (cdkDropListDropped)="dropEquipment(pair[0],$event)"><ng-container *ngIf="equipped(pair[0]) as eq"><div cdkDrag [cdkDragData]="equipDragData(pair[0],eq)" (cdkDragStarted)="onDragStart($event)" (cdkDragEnded)="onDragEnd()" class="item"><img class="item-icon" [src]="catalog.itemIcon(eq.itemId)" [alt]="catalog.item(eq.itemId)?.name||eq.itemId"><small>{{pair[1]}}</small></div></ng-container><span *ngIf="!equipped(pair[0])">{{pair[1]}}</span></div></div><div cdkDropListGroup class="inv-grid"><div *ngFor="let i of slots" class="inv-slot" cdkDropList [cdkDropListData]="i" (cdkDropListDropped)="dropInventory($event)"><div *ngIf="item(i) as it" cdkDrag [cdkDragData]="dragData(it)" (cdkDragStarted)="onDragStart($event)" (cdkDragEnded)="onDragEnd()" class="item" [title]="itemTitle(it)" (dblclick)="catalog.item(it.itemId)?.type==='consumable' && inventory.useConsumable(it.itemId)"><img class="item-icon" [src]="glyph(it)" alt=""><b *ngIf="it.quantity>1">{{it.quantity}}</b></div></div></div></section>
