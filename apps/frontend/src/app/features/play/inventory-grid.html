<section class="panel inventory">
    <div class="panel-title">
        <span>Inventory</span>
        <button type="button" class="inventory-sort-button" aria-label="Sort inventory by type and name"
            title="Sort inventory" [disabled]="sorting()" (click)="sortInventory()">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 6h10M4 11h7M4 16h4M18 4v15m-4-4 4 4 4-4" /></svg>
        </button>
    </div>
    <small *ngIf="sortError()" class="inventory-error">{{sortError()}}</small>
    <div id="inventory-drop-list" cdkDropList cdkDropListSortingDisabled
        [cdkDropListConnectedTo]="characterSlotIds.concat(vendorDropListIds)"
        (cdkDropListDropped)="dropInventory($event)" class="inv-grid">
        <div *ngFor="let i of slots" class="inv-slot" [attr.data-slot-index]="i"
            [class.drop-target]="highlightedSlot() === i">
            <div *ngIf="item(i) as it" cdkDrag [cdkDragData]="dragData(it)" (cdkDragStarted)="onDragStart($event)"
                (cdkDragEnded)="onDragEnd()" class="item" [ngClass]="itemTierClass(it)" (click)="onItemClick($event,it)" (dblclick)="doubleClick(it)">
                <img class="item-icon" [src]="glyph(it)" [alt]="itemTitle(it)"><b
                    *ngIf="displayQuantity(it)>1">{{displayQuantity(it)}}</b>
                <div class="item-tooltip"><strong>{{itemTitle(it)}}</strong><span
                        *ngFor="let line of itemTooltipLines(it)" [class.tooltip-warning]="line.warning">{{line.label ? line.label + ': ' : ''}}{{line.value}}</span></div>
                <ng-template cdkDragPreview><img class="drag-preview-icon" [src]="glyph(it)"
                        [alt]="itemTitle(it)"></ng-template><ng-template cdkDragPlaceholder><span
                        class="item-drag-placeholder"></span></ng-template>
            </div>
        </div>
    </div>
</section>

<div *ngIf="splitItem() as split" class="split-modal-backdrop" (click)="closeSplitModal()">
    <section class="split-modal" role="dialog" aria-modal="true" aria-labelledby="split-modal-title" (click)="$event.stopPropagation()">
        <h2 id="split-modal-title">Split {{itemTitle(split)}}</h2>
        <p>Current stack: {{split.quantity}}. Choose how many items to move into a new stack.</p>
        <label for="split-quantity">Quantity to split</label>
        <input id="split-quantity" type="number" min="1" [max]="split.quantity - 1" step="1"
            [value]="splitQuantity()" (input)="setSplitQuantity($event)" />
        <div class="split-modal-actions">
            <button type="button" (click)="closeSplitModal()">Cancel</button>
            <button type="button" class="split-confirm" (click)="confirmSplit()">Split</button>
        </div>
    </section>
</div>
