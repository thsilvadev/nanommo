<section class="panel inventory"><div class="panel-title"><span>Inventory</span></div><div cdkDropListGroup class="inv-grid"><div *ngFor="let i of slots" class="inv-slot" cdkDropList [cdkDropListData]="i" (cdkDropListDropped)="drop($event)"><div *ngIf="item(i) as it" cdkDrag [cdkDragData]="it" class="item" [title]="itemTitle(it)"><img class="item-icon" [src]="glyph(it)" alt=""><b *ngIf="it.quantity>1">{{it.quantity}}</b></div></div></div></section>
