<div class="grind-page">
  <div class="grind-inventory-column">
    <div class="active-gambit">
      <div class="active-gambit-title">Active Gambit</div>
      <select
        [value]="activeGambitId()"
        [disabled]="loading() || !gambits().length"
        (change)="selectGambit($any($event.target).value)"
        aria-label="Active Gambit">
        <option value="" disabled>Select Gambit</option>
        <option *ngFor="let gambit of gambits()" [value]="gambit.id">{{gambit.title || ('Gambit ' + (gambit.slotIndex + 1))}}</option>
      </select>
      <small *ngIf="error()">{{error()}}</small>
    </div>
    <div class="grind-mode-select" aria-label="Hunting mode">
      <button type="button" [class.active]="character.character()?.status!=='town' && huntMode()==='hunting'" [disabled]="loading() || !huntMode()" (click)="selectStance('hunting')" title="Hunting">
        <img src="/assets/ui/hunting.svg" alt="Hunting">
      </button>
      <button type="button" [class.active]="character.character()?.status!=='town' && huntMode()==='gathering'" [disabled]="loading() || !huntMode()" (click)="selectStance('gathering')" title="Gathering">
        <img src="/assets/ui/gathering.svg" alt="Gathering">
      </button>
      <span class="traveling-stance" [class.active]="!!character.character()?.travelIntent" [class.inactive]="!character.character()?.travelIntent" title="Traveling is automatic while a route is active" aria-label="Traveling">
        <img src="/assets/ui/fleeing.svg" alt="Traveling">
      </span>
    </div>
    <div class="grind-inventory"><app-inventory-grid /></div>
  </div>
  <div class="grind-map-column">
    <div class="grind-map"><app-map-board /></div>
    <app-idle-chat />
  </div>
</div>
