<section class="sheet" [style.height.px]="height()" [class.dragging]="dragPx()!==null"><div class="handle" (pointerdown)="down($event)" (pointermove)="move($event)" (pointerup)="up($event)"></div><div class="sheet-body"><div class="sheet-title">{{state()}}</div><ng-container *ngIf="town"><div *ngIf="detent==='peek';else townFull" class="town-peek"><span>In Town</span><button type="button" (click)="router.navigateByUrl('/play/m/map')">Escolher mapa</button></div><ng-template #townFull><div class="town-content"><app-vendor-panel /></div></ng-template></ng-container><div *ngIf="!town" class="battle-content"><div *ngIf="battle.active() as b"><strong>{{b.monsterId}}</strong><small>Battle #{{b.sequenceIndex+1}}</small><app-battle-log [events]="events()" /></div><div *ngIf="!battle.active()">Waiting for authoritative encounter queue.</div></div></div></section>
