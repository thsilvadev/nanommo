<app-mobile-shell *ngIf="isMobileShell();else desktopShell" (deleteAccount)="openDeleteAccount()" />
<ng-template #desktopShell><div class="game-app">
<header class="game-topbar">
  <div class="brand-logo"><img src="/assets/lords-transparent.png" alt="Lords"></div>
  <nav class="main-tabs" aria-label="Game navigation">
    <button [class.active]="is('/play/grind')||is('/play')" (click)="go('/play/grind')">Grind</button>
    <button [class.active]="is('/play/character')" (click)="goCharacter()">Character</button>
    <button (click)="go('/play/gambits')">Gambits</button>
    <button class="muted">Tournament</button><button class="muted">Trade</button>
  </nav>
  <div class="top-character" *ngIf="character.character() as c">
    <div class="avatar-mini">{{c.name.slice(0,1).toUpperCase()}}</div>
    <div><strong>{{c.name}}</strong><small>Lv. {{c.level}}</small></div>
    <div class="xp-stack"><small>{{activeGambitTitle()}}</small><div class="xp-mini" [title]="xpTitle()"><span [style.width.%]="xpWidth()"></span></div></div>
    <div class="resource gold"><img src="/assets/ui/coin.svg" alt=""> {{c.gold | number}}</div>
  </div>
  <div class="top-actions"><app-login-music-control variant="header" /><button (click)="chatOpen.set(!chatOpen())">CHAT</button><div class="settings-wrap"><button aria-label="Settings" (click)="settingsOpen.set(!settingsOpen())"><img src="/assets/ui/settings.svg" alt=""></button><div class="settings-menu" *ngIf="settingsOpen()"><button (click)="openDeleteAccount()">Delete account</button></div></div><button (click)="auth.logout()">EXIT</button></div>
</header>
<main class="game-board">
  <aside class="zone-left"><app-character-summary /></aside>
  <section class="zone-center"><router-outlet /></section>
  <aside class="zone-right"><app-grind-info /></aside>
</main>
<app-chat-drawer [open]="chatOpen()" (closed)="chatOpen.set(false)" />
</div></ng-template>

<app-trade-modal />
<app-account-delete-modal [open]="deleteAccountOpen()" [error]="deleteAccountError()" (closed)="cancelDeleteAccount()" (confirmed)="confirmDeleteAccount()" />
