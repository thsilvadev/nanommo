<section class="mobile-char" *ngIf="character.character() as c"><div class="char-identity"><div class="portrait">{{c.name.slice(0,1).toUpperCase()}}</div><h1>{{c.name}}</h1><small>Lv {{c.level}} · {{c.status==='town'?'In Town':'Grinding'}}</small></div><div class="char-detail"><div class="bars"><span>HP {{c.hpCurrent}} / {{c.maxHp}}</span><span>SP {{c.spCurrent}} / {{c.maxSp}}</span></div><div class="food-row"><span>{{c.hungry?'HUNGRY':'FED'}}</span><label>Auto Feed <input type="checkbox" [checked]="c.autoFeed" (change)="toggleAutoFeed()"></label></div><div class="diet"><div *ngFor="let i of dietSlots" class="diet-slot"><img [src]="dietIcon(i)" [alt]="dietName(i)"><strong>{{dietStars(i)}}</strong><small *ngIf="dietEntry(i)">{{dietRemaining(i)}}s</small></div></div><div class="status">Status: {{c.status}}</div></div><div class="equipment"><div *ngFor="let s of slots" class="equip"><img [src]="item(s)" alt=""></div></div></section>
