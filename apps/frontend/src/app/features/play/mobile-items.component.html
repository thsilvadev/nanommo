<section class="items-mobile"><header><h1>Itens</h1><span>{{character.character()?.gold||0}} G</span></header><div class="equipment"><button *ngFor="let s of equipment" type="button" [attr.aria-label]="equipped(s)?'Equipado: '+(catalog.item(equipped(s)!.itemId)?.name||equipped(s)!.itemId):s" (click)="equipped(s)&&tap(equipped(s)!,true)"><img [src]="equipped(s)?icon(equipped(s)!.itemId):'/assets/ui/'+s+'.svg'" alt=""></button></div><div class="inventory"><button *ngFor="let i of slots" type="button" class="slot" [attr.aria-label]="item(i)?catalog.item(item(i)!.itemId)?.name||item(i)!.itemId:'Empty slot'" (click)="item(i)&&tap(item(i)!,false)"><img *ngIf="item(i)" [src]="icon(item(i)!.itemId)" alt=""><b *ngIf="item(i)">{{item(i)!.quantity}}</b></button></div></section><app-action-sheet *ngIf="selected() as s" [itemName]="catalog.item(s.item.itemId)?.name||s.item.itemId" [itemClass]="format.itemTierClass(catalog.item(s.item.itemId))" [details]="selectedDetails()" [actions]="actions()" (action)="act($event)" (closed)="close()" />
