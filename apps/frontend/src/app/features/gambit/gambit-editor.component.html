<section class="gambit-editor"><header class="gambit-head"><div><small>GAMBITS</small><h2>Combat priority pages</h2></div><div class="head-actions"><button (click)="addLine()" [disabled]="!page()||lines().length>=20">+ Add line</button><button (click)="save()" [disabled]="saving()">{{saving()?'Saving...':'Save Page'}}</button><button (click)="activate()" [disabled]="!page()||character.character()?.activeGambitPageId===page().id">Activate</button></div></header>
<div class="page-tabs"><button *ngFor="let p of pages();let i=index" [class.active]="i===active()" (click)="active.set(i)">Page {{i+1}} <span *ngIf="p.id===character.character()?.activeGambitPageId">ACTIVE</span></button></div>
<div *ngIf="page() as p;else empty" class="page-meta"><input [(ngModel)]="p.title" aria-label="Gambit page title"><span>{{lines().length}} / 20 lines</span></div>
<div *ngIf="page() as p" cdkDropList class="line-list" (cdkDropListDropped)="reorder($event)">
 <article *ngFor="let line of p.lines;let i=index" cdkDrag class="gambit-line" [class.disabled]="line.enabled===false">
  <div class="priority">{{i+1}}</div><div class="line-main">
   <div class="node-block"><small>CONDITION</small><select [ngModel]="line.conditions[0].id" (ngModelChange)="changeCondition(line,0,$event)"><option *ngFor="let c of conditionOptions()" [value]="c.id">{{c.label}}</option></select><div class="param-row"><ng-container *ngFor="let spec of paramSpecs(line.conditions[0],'condition')"><label>{{paramLabel(spec.name)}}<ng-container [ngSwitch]="spec.type"><select *ngSwitchCase="'enum'" [ngModel]="paramValue(line.conditions[0],spec.name)" (ngModelChange)="setParam(line.conditions[0],spec.name,$event)"><option *ngFor="let v of spec.values" [value]="v">{{v}}</option></select><select *ngSwitchCase="'itemRef'" [ngModel]="paramValue(line.conditions[0],spec.name)" (ngModelChange)="setParam(line.conditions[0],spec.name,$event)"><option value="">Select item...</option><option *ngFor="let item of itemOptions()" [value]="item.id">{{item.name}}</option></select><select *ngSwitchCase="'skillRef'" [ngModel]="paramValue(line.conditions[0],spec.name)" (ngModelChange)="setParam(line.conditions[0],spec.name,$event)"><option value="">Select skill...</option><option *ngFor="let skill of skillOptions()" [value]="skill.id">{{skill.name}}</option></select><input *ngSwitchDefault [type]="spec.type==='number'?'number':'text'" [ngModel]="paramValue(line.conditions[0],spec.name)" (ngModelChange)="setParam(line.conditions[0],spec.name,valueForInput(spec,$event))"></ng-container></label></ng-container></div></div>
   <div class="node-block action-block"><small>ACTION</small><select [ngModel]="line.action.id" (ngModelChange)="changeAction(line,$event)"><option *ngFor="let a of actionOptions()" [value]="a.id">{{a.label}}</option></select><div class="param-row"><ng-container *ngFor="let spec of paramSpecs(line.action,'action')"><label>{{paramLabel(spec.name)}}<ng-container [ngSwitch]="spec.type"><select *ngSwitchCase="'enum'" [ngModel]="paramValue(line.action,spec.name)" (ngModelChange)="setParam(line.action,spec.name,$event)"><option *ngFor="let v of spec.values" [value]="v">{{v}}</option></select><select *ngSwitchCase="'itemRef'" [ngModel]="paramValue(line.action,spec.name)" (ngModelChange)="setParam(line.action,spec.name,$event)"><option value="">Select item...</option><option *ngFor="let item of itemOptions()" [value]="item.id">{{item.name}}</option></select><select *ngSwitchCase="'skillRef'" [ngModel]="paramValue(line.action,spec.name)" (ngModelChange)="setParam(line.action,spec.name,$event)"><option value="">Select skill...</option><option *ngFor="let skill of skillOptions()" [value]="skill.id">{{skill.name}}</option></select><input *ngSwitchDefault [type]="spec.type==='number'?'number':'text'" [ngModel]="paramValue(line.action,spec.name)" (ngModelChange)="setParam(line.action,spec.name,valueForInput(spec,$event))"></ng-container></label></ng-container></div></div>
   <label class="switch" title="Enable Gambit line"><input type="checkbox" [checked]="line.enabled!==false" (change)="line.enabled=$any($event.target).checked"><span aria-hidden="true"></span></label>
  </div><button class="remove" (click)="remove(i)">×</button>
 </article>
</div>
<ng-template #empty><div class="empty">No Gambit pages found.</div></ng-template><p *ngIf="error()" class="error">{{error()}}</p><div *ngIf="validation().length" class="validation"><b>Server validation</b><div *ngFor="let e of validation()">{{e.path}} — {{e.message}}</div></div>
</section>
