networks:
  default:
    driver: bridge
    driver_opts:
      com.docker.network.enable_ipv6: "false"
  rede-compartilhada:
      external: true
services:
  db:
    image: postgres:16-alpine
    container_name: nanommo-postgres
    env_file:
      - .env
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nanommo"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - rede-compartilhada

  redis:
    image: redis:7-alpine
    container_name: nanommo-redis
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?Set REDIS_PASSWORD in the deployment .env}
    command: ["sh", "-c", "exec redis-server --requirepass \"$${REDIS_PASSWORD}\""]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD-SHELL", "REDISCLI_AUTH=\"$${REDIS_PASSWORD}\" redis-cli ping | grep -q PONG"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - rede-compartilhada

  backend:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    container_name: nanommo-backend
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    env_file:
      - .env
    ports:
      - "3010:3000"
    networks:
      - rede-compartilhada

volumes:
  postgres_data:
  redis_data:
