name: Deploy Backend

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Deploy to production server via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            set -e
            cd ~/nanommo
            git fetch origin main
            git reset --hard origin/main
            git clean -fd
            require_env() {
              key="$1"
              expected="$2"
              actual="$(grep -m1 "^${key}=" .env | cut -d= -f2- || true)"
              if [ "$actual" != "$expected" ]; then
                echo "Refusing deploy: set ${key}=${expected} in the server .env (actual value is absent or different)."
                exit 1
              fi
            }
            require_env BATTLE_TICK_DURATION_MS 500
            require_env BATTLE_RESOLVE_CONCURRENCY 4
            require_env BATTLE_QUEUE_CONCURRENCY 2
            require_env WORLD_ACTIVITY_CONCURRENCY 1
            require_env BATTLE_TICKRATE_500MS_CUTOVER_COMPLETE true
            docker compose up -d --build
            echo '--- Production container status ---'
            docker compose ps
            echo '--- Redis target (secrets redacted) ---'
            printf 'REDIS_HOST=%s REDIS_PORT=%s REDIS_URL_SET=%s REDIS_PASSWORD_SET=%s\n' "$(grep -m1 '^REDIS_HOST=' .env | cut -d= -f2-)" "$(grep -m1 '^REDIS_PORT=' .env | cut -d= -f2-)" "$(grep -q '^REDIS_URL=.' .env && echo yes || echo no)" "$(grep -q '^REDIS_PASSWORD=.' .env && echo yes || echo no)"
            echo '--- Compose Redis health ---'
            docker compose exec -T redis redis-cli ping || true
            echo '--- Backend Redis-related startup logs ---'
            docker compose logs --no-color --tail=120 backend 2>&1 | grep -Ei 'redis|error|fatal|exception|NOAUTH|HELLO' | tail -60 || true
